name: EClean
options:
  bundleIdPrefix: com.eclean
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    PRODUCT_NAME: EClean
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  EClean:
    type: application
    platform: macOS
    sources:
      - path: EClean
        excludes:
          - Resources/Binaries/**
          - Info.plist
          - EClean.entitlements
      - path: EClean/Resources/Binaries
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eclean.app
        INFOPLIST_FILE: EClean/Info.plist
        CODE_SIGN_ENTITLEMENTS: EClean/EClean.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
