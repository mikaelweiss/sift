name: Sift
options:
  bundleIdPrefix: org.weisssolutions
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.12"
    CURRENT_PROJECT_VERSION: "13"
    PRODUCT_NAME: Sift
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Sift:
    type: application
    platform: macOS
    sources:
      - path: Sift
        excludes:
          - Resources/Binaries/**
          - Info.plist
          - Sift.entitlements
      - path: Sift/Resources/Binaries
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.weisssolutions.sift
        INFOPLIST_FILE: Sift/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sift/Sift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
